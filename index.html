<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uitzending</title>
<style>
  body { font-family: sans-serif; text-align: center; margin: 1rem; color: #100b70; }
  #speler-kader { position: relative; max-width: 960px; margin: 0 auto; aspect-ratio: 16 / 9; background: #000; }
  #speler-kader iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
  button { font-size: 1.1rem; padding: .6rem 1.2rem; margin: .8rem; cursor: pointer; }
  #bericht { font-size: 1.2rem; line-height: 1.5; }
  .knop { display: inline-block; background: #c2276f; color: #fff; padding: .8rem 1.6rem; border-radius: 4px;
          text-decoration: none; font-size: 1.1rem; margin-top: .8rem; }
  #terug-info { font-size: .95rem; color: #555; }
</style>
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<div id="wacht" hidden><div id="timer-plek"></div></div>
<div id="spelen" hidden>
  <div id="speler-kader"></div>
  <button id="geluid" hidden>🔊 Geluid aan</button>
</div>
<p id="bericht">Even laden…</p>
<p id="terug-info"></p>

<script>
// ===== INSTELLINGEN =====
var API = 'https://script.google.com/macros/s/AKfycbwb4Y9IoFiDaIbfYn1W43Dbmu7yTHTvvDJU-FklheRXu1ckD9JnXp14uno1zZLQG_0x/exec';   // de URL van de Apps Script-webapp (eindigt op /exec)
var INSTAPPEN = true;                   // true: wie later binnenkomt springt naar de juiste plek; false: altijd vanaf het begin
var AGENDA_PAGINA = 'https://www.berkelblik.nl/uitzendagenda';
var AUTO_TERUG_SEC = 20;                // na afloop automatisch terug naar de agenda na zoveel seconden (0 = uit, alleen de knop)

var scheef = 0, data = null, toon = '', speler = null, getoondeStart = null, geladen = false;
var keekMee = false, terugTimer = null, terugGestart = false;

function nu() { return Date.now() + scheef; }   // tijd volgens de server

function terugKnop() {
  return '<br><a class="knop" href="' + AGENDA_PAGINA + '" target="_top">Terug naar de uitzendagenda</a>';
}

function haalOp() {
  fetch(API, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      scheef = d.nu - Date.now();
      // uitzending verplaatst terwijl de teller loopt: pagina opnieuw laden met de nieuwe tijd
      if (toon === 'wacht' && d.gepland && getoondeStart && d.startLokaal !== getoondeStart) {
        location.reload();
        return;
      }
      data = d.gepland ? d : null;
      geladen = true;
      bijwerken();
    })
    .catch(function () { /* netwerkfout: de laatst bekende gegevens blijven gelden */ });
}

function bijwerken() {
  if (!geladen) return;
  if (!data) return scherm('geen');
  var t = nu(), s = Date.parse(data.start), e = Date.parse(data.einde);
  if (t >= e) return scherm('afgelopen');
  if (t >= s) return scherm('spelen');
  scherm('wacht');
}

function scherm(naam) {
  if (naam === toon && naam !== 'spelen') return;
  var b = document.getElementById('bericht');
  document.getElementById('wacht').hidden = (naam !== 'wacht');

  if (naam === 'wacht' || naam === 'spelen') stopTerug();

  if (naam === 'wacht') {
    keekMee = false;
    bouwTeller();
    b.textContent = '';
  } else if (naam === 'spelen') {
    if (data.video) { b.textContent = ''; startSpeler(); }
    else { stopSpeler(); b.textContent = 'De uitzending begint zo meteen…'; }
  } else if (naam === 'afgelopen') {
    stopSpeler();
    b.innerHTML = '<strong>De uitzending is afgelopen.</strong><br>Bedankt voor het kijken!' + terugKnop();
    startTerug();
  } else {
    stopSpeler();
    b.innerHTML = 'Er staat nog geen uitzending gepland.<br>' +
      'Kijk in de agenda wanneer de volgende uitzending staat gepland.' + terugKnop();
    startTerug();
  }
  document.getElementById('spelen').hidden = !speler;
  toon = naam;
}

// Na afloop automatisch terug naar de agenda (alleen voor wie de uitzending heeft bekeken)
function startTerug() {
  if (!AUTO_TERUG_SEC || !keekMee || terugGestart) return;
  terugGestart = true;
  var rest = AUTO_TERUG_SEC, info = document.getElementById('terug-info');
  function tik() {
    if (rest <= 0) {
      clearInterval(terugTimer);
      try { window.top.location.href = AGENDA_PAGINA; } catch (e) {}
      info.textContent = 'Gebruik de knop hierboven om terug te keren.';
      return;
    }
    info.textContent = 'U wordt over ' + rest + ' seconden automatisch teruggeleid naar de uitzendagenda.';
    rest--;
  }
  tik();
  terugTimer = setInterval(tik, 1000);
}

function stopTerug() {
  clearInterval(terugTimer);
  terugTimer = null;
  terugGestart = false;
  document.getElementById('terug-info').textContent = '';
}

function bouwTeller() {
  if (getoondeStart === data.startLokaal) return;
  if (getoondeStart !== null) { location.reload(); return; }   // de teller-widget laadt maar één keer per pagina
  getoondeStart = data.startLokaal;
  var a = document.createElement('a');
  a.href = 'https://logwork.com/countdown-timer';
  a.className = 'countdown-timer';
  a.setAttribute('data-timezone', 'Europe/Amsterdam');
  a.setAttribute('data-language', 'nl');
  a.setAttribute('data-textcolor', '#100b70');
  a.setAttribute('data-date', data.startLokaal);
  a.textContent = 'De geplande uitzending begint over circa:';
  document.getElementById('timer-plek').appendChild(a);
  var s = document.createElement('script');
  s.src = 'https://cdn.logwork.com/widget/countdown.js';
  document.body.appendChild(s);
}

function startSpeler() {
  if (speler) return;
  if (!window.YT || !YT.Player) return;   // YouTube-API nog niet geladen; onYouTubeIframeAPIReady probeert opnieuw
  document.getElementById('speler-kader').innerHTML = '<div id="yt"></div>';
  var offset = INSTAPPEN ? Math.max(0, Math.floor((nu() - Date.parse(data.start)) / 1000)) : 0;
  speler = new YT.Player('yt', {
    host: 'https://www.youtube-nocookie.com',
    videoId: data.video,
    playerVars: { autoplay: 1, mute: 1, start: offset, rel: 0, playsinline: 1 },
    events: {
      onReady: function (ev) {
        ev.target.mute();
        ev.target.playVideo();
        document.getElementById('geluid').hidden = false;
      }
    }
  });
  keekMee = true;
}

function stopSpeler() {
  if (speler) { try { speler.destroy(); } catch (e) {} speler = null; }
  document.getElementById('speler-kader').innerHTML = '';
  document.getElementById('geluid').hidden = true;
}

document.getElementById('geluid').onclick = function () {
  if (speler) { speler.unMute(); speler.setVolume(100); }
  this.hidden = true;
};

function onYouTubeIframeAPIReady() { bijwerken(); }

setInterval(bijwerken, 1000);    // klok: wisselt tussen teller en speler
setInterval(haalOp, 60000);      // agenda: elke minuut opnieuw ophalen
haalOp();
</script>
</body>
</html>
