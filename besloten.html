<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Besloten produkties</title>
<style>
  /* invoerscherm: zoals het was */
  body { font-family: Arial, sans-serif; margin: 1rem; color: #222; text-align: center; }
  .kader { max-width: 320px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; margin: 10px 0; border: 1px solid #ccc; border-radius: 3px; }
  button { width: 100%; padding: 8px; background: #5f6c37; color: #fff; border: 0; border-radius: 3px; cursor: pointer; }
  button:hover { background: #455027; }
  button:disabled { background: #8a9367; cursor: wait; }
  #fout { color: #b00; font-weight: bold; min-height: 1.2em; }
  #bezig { color: #455027; margin: .4rem 0; }
  #zand { display: inline-block; animation: draai 1.6s steps(2, jump-none) infinite; }
  @keyframes draai { to { transform: rotate(180deg); } }
  @media (prefers-reduced-motion: reduce) { #zand { animation: none; } }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #a0105a; outline-offset: 2px; }

  /* verslagweergave na het invoeren van de code */
  :root { --zacht: #6b675e; --lijn: #d9d5c9; --olijf: #5f6c37; --olijf-donker: #455027; --accent: #a0105a; }
  #inhoud { max-width: 640px; margin: 0 auto; font-family: Georgia, "Times New Roman", serif; line-height: 1.6; color: #26241f; }
  #kop { font-size: 1.5rem; line-height: 1.3; margin-top: .6rem; }
  #naam { font-size: 2.3rem; line-height: 1.2; font-weight: bold; margin: .4rem 0 1.4rem; }
  #links { display: flex; flex-wrap: wrap; gap: .8rem; justify-content: center; margin: 1.6rem 0; }
  #links a { flex: 1 1 240px; padding: .9rem 1rem; border: 1px solid var(--olijf); border-radius: 4px; color: var(--olijf-donker); text-decoration: none; font-size: 1.1rem; }
  #links a:hover { background: var(--olijf); color: #fff; }
  #links a small { display: block; font-size: .85rem; opacity: .8; }
  #teller { font-size: 1.2rem; margin: 1.2rem 0; padding: .8rem; border-top: 1px solid var(--lijn); border-bottom: 1px solid var(--lijn); color: var(--olijf-donker); }
  #speler { position: relative; aspect-ratio: 16 / 9; background: #000; margin: 1.2rem 0; }
  #speler iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #toel { white-space: pre-line; text-align: left; font-size: 1.1rem; line-height: 1.75; margin: 1.8rem auto 0; max-width: 34em; }
  #toel:empty { display: none; }
  #geldig { margin-top: 2.4rem; padding-top: 1rem; border-top: 1px solid var(--lijn); font-size: .85rem; color: var(--zacht); font-family: Arial, sans-serif; }
  #geldig.snel { color: var(--accent); font-weight: bold; }
  #geldig a { color: inherit; }
</style>
</head>
<body>

<div id="invoer" class="kader">
  <h4>Hoe luidt het toegekende wachtwoord?</h4>
  <form id="f">
    <input type="password" id="code" required autocomplete="off">
    <p id="fout" role="alert"></p>
    <p id="bezig" hidden><span id="zand">&#9203;</span> Even geduld, de code wordt gecontroleerd&hellip;</p>
    <button type="submit" id="ok">OK</button>
  </form>
</div>

<div id="inhoud" hidden>
  <div id="kop"></div>
  <h1 id="naam"></h1>
  <div id="teller" hidden></div>
  <div id="speler" hidden></div>
  <div id="links"></div>
  <div id="toel"></div>
  <div id="geldig" hidden></div>
</div>

<script>
// ===== INSTELLINGEN =====
var API = 'https://script.google.com/macros/s/AKfycbwb4Y9IoFiDaIbfYn1W43Dbmu7yTHTvvDJU-FklheRXu1ckD9JnXp14uno1zZLQG_0x/exec';
var TEKST_AUDIO = 'Dienst beluisteren';
var SUB_AUDIO = 'Opname van de dienst';
var TEKST_TERUGBLIK = 'Gesproken terugblik';
var SUB_TERUGBLIK = 'Terugblik op de dienst';
var CONTACT_MAIL = '';          // bv. 'beheer@voorbeeld.nl'; leeg = alleen de tekst "de beheerder"
var WAARSCHUWING_DAGEN = 30;    // zoveel dagen voor het einde wordt de zichtbaarheidsregel opvallend
var MELDING = {
  onjuist: 'Het ingegeven wachtwoord is onjuist.',
  verlopen: 'Deze pagina is niet meer beschikbaar. Neem contact op met de producent.',
  druk: 'Even te veel pogingen. Probeer het over een minuut opnieuw.',
  fout: 'Er ging iets mis. Probeer het later opnieuw.'
};

// Teksten per soort dienst (kolom Aard). De sleutel wordt vergeleken met het begin van Aard,
// zonder hoofdletters: 'doop' past dus ook bij 'Doopdienst'. Onbekende Aard: de standaardteksten hierboven.
var TEKSTEN = {
  'uitvaart': { kop: 'Verslag van de uitvaart',
                audio: 'Dienst beluisteren', subAudio: 'Opname van de dienst',
                terugblik: 'Gesproken terugblik', subTerugblik: 'Terugblik op de dienst' },
  'huwelijk': { kop: 'Verslag van de huwelijksdienst',
                audio: 'Dienst beluisteren', subAudio: 'Opname van de huwelijksdienst',
                terugblik: 'Gesproken terugblik', subTerugblik: 'Terugblik op de huwelijksdienst' },
  'bijeenkomst': { kop: 'Verslag van de bijeenkomst', zonderVan: true,
                audio: 'Bijeenkomst beluisteren', subAudio: 'Opname van de bijeenkomst',
                terugblik: 'Gesproken terugblik', subTerugblik: 'Terugblik op de bijeenkomst' },
  'overig':   { kop: 'Verslag van de bijeenkomst', zonderVan: true,
                audio: 'Bijeenkomst beluisteren', subAudio: 'Opname van de bijeenkomst',
                terugblik: 'Gesproken terugblik', subTerugblik: 'Terugblik op de bijeenkomst' },
  'doop':     { kop: 'Verslag van de doopdienst',
                audio: 'Dienst beluisteren', subAudio: 'Opname van de doopdienst',
                terugblik: 'Gesproken terugblik', subTerugblik: 'Terugblik op de doopdienst' }
};
function tekstenVoor(aard) {
  var a = (aard || '').toLowerCase().trim();
  if (!a) return null;
  for (var k in TEKSTEN) if (a.indexOf(k) === 0) return TEKSTEN[k];
  return null;
}

var scheef = 0, d = null, timer = null, speler = false;
function $(id) { return document.getElementById(id); }
function nu() { return Date.now() + scheef; }
function lang(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
}

function bezig(aan) {
  $('bezig').hidden = !aan;
  $('ok').disabled = aan;
}

$('f').onsubmit = function (ev) {
  ev.preventDefault();
  if ($('ok').disabled) return;
  var code = $('code').value.trim();
  $('code').value = '';
  $('fout').textContent = '';
  bezig(true);
  fetch(API + '?code=' + encodeURIComponent(code), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (u) {
      bezig(false);
      if (u.ok) toon(u);
      else $('fout').textContent = MELDING[u.reden] || MELDING.onjuist;
    })
    .catch(function () { bezig(false); $('fout').textContent = MELDING.fout; });
};

// Lege code vooraf versturen: wekt het script alvast, zodat het antwoord straks sneller komt
fetch(API + '?code=', { cache: 'no-store' }).catch(function () {});

function link(tekst, sub, url) {
  if (!/^https?:\/\//i.test(url || '')) return;
  var a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  a.appendChild(document.createTextNode(tekst));
  var s = document.createElement('small');
  s.textContent = sub;
  a.appendChild(s);
  $('links').appendChild(a);
}

function toon(u) {
  d = u;
  scheef = u.nu - Date.now();
  var iso = /^\d{4}-\d{2}-\d{2}$/.test(u.datum || '');
  var datum = iso ? lang(u.datum) : (u.datum || '');
  var T = tekstenVoor(u.aard);
  var kopTekst = T ? T.kop : (u.aard ? 'Verslag van de ' + u.aard.toLowerCase() : 'Verslag');
  $('kop').textContent = kopTekst + (datum ? ' op ' + datum : '') + (T && T.zonderVan ? '' : ' van');
  $('naam').textContent = u.betreft || '';
  $('toel').textContent = u.toelichting || '';
  link(T ? T.audio : TEKST_AUDIO, T ? T.subAudio : SUB_AUDIO, u.audio);
  link(T ? T.terugblik : TEKST_TERUGBLIK, T ? T.subTerugblik : SUB_TERUGBLIK, u.terugblik);

  if (/^\d{4}-\d{2}-\d{2}$/.test(u.zichtbaarTot || '')) {
    var resterend = (Date.parse(u.zichtbaarTot + 'T23:59:59') - nu()) / 86400000;
    var g = $('geldig');
    g.textContent = 'Deze pagina is beschikbaar tot en met ' + lang(u.zichtbaarTot) +
      '. Wilt u er daarna nog gebruik van maken, neem dan vóór die datum contact op met de beheerder';
    if (CONTACT_MAIL) {
      g.appendChild(document.createTextNode(' ('));
      var m = document.createElement('a');
      m.href = 'mailto:' + CONTACT_MAIL; m.textContent = CONTACT_MAIL;
      g.appendChild(m);
      g.appendChild(document.createTextNode(')'));
    }
    g.appendChild(document.createTextNode('.'));
    if (resterend <= WAARSCHUWING_DAGEN) g.className = 'snel';
    g.hidden = false;
  }

  $('invoer').hidden = true;
  $('inhoud').hidden = false;
  if (u.video) { tik(); timer = setInterval(tik, 1000); }
}

function tik() {
  var t = nu(), s = d.start ? Date.parse(d.start) : null, e = d.einde ? Date.parse(d.einde) : null;
  if (s && t < s) {
    var rest = Math.ceil((s - t) / 1000), h = Math.floor(rest / 3600), m = Math.floor(rest % 3600 / 60), sec = rest % 60;
    $('teller').hidden = false;
    $('teller').textContent = 'De uitzending begint over ' + (h ? h + ' u ' : '') + m + ' min ' + sec + ' s';
    return;
  }
  $('teller').hidden = true;
  if (speler) return;
  speler = true;
  clearInterval(timer);
  var live = s && t >= s && (!e || t < e);
  var offset = live ? Math.max(0, Math.floor((t - s) / 1000)) : 0;
  var id = encodeURIComponent(d.video), url;
  if (d.platform === 'vimeo') {
    url = 'https://player.vimeo.com/video/' + id + '?dnt=1' + (d.hash ? '&h=' + encodeURIComponent(d.hash) : '') +
      (live ? '&autoplay=1&muted=1' : '') + (offset ? '#t=' + offset + 's' : '');
  } else {
    url = 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0' + (live ? '&autoplay=1&mute=1' : '') + (offset ? '&start=' + offset : '');
  }
  var f = document.createElement('iframe');
  f.src = url; f.allow = 'autoplay; fullscreen; picture-in-picture'; f.setAttribute('allowfullscreen', ''); f.title = d.videoTitel || 'Uitzending';
  $('speler').appendChild(f);
  $('speler').hidden = false;
}
</script>
</body>
</html>
